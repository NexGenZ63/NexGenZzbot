<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PuckScore · Joueurs H2H</title>
<style>
:root{--bg:#060b1a;--card:#0e1a33;--line:#1c2a4a;--tx:#f2f6ff;--mu:#8d9bbd;--ac:#3be8b0;--rd:#ff6b7a;--yl:#ffd166}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:max(16px,env(safe-area-inset-top)) 16px 24px}
a{color:var(--ac)}h1{font-size:20px;margin:0 0 12px}h4{margin:12px 0 4px}
select,input{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin-bottom:8px}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;background:var(--card);color:var(--mu);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;cursor:pointer}
.seg button.on{color:#04130e;background:var(--ac);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.r{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.r:first-of-type{border-top:0}
img.h{width:44px;height:44px;border-radius:50%;background:var(--bg)}
.in{flex:1}.mu{color:var(--mu);font-size:13px}.ac{color:var(--ac)}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:4px}.bar u{display:block;height:100%;border-radius:4px}
.det{font-size:14px;padding:0 0 8px}
</style></head><body>
<h1>🏒 Joueurs H2H · <a href="/">Retour</a></h1>
<input type="date" id="dt" onchange="games()">
<select id="gm" onchange="run()"></select>
<select id="mk" onchange="run()"></select>
<div class="seg"><button data-a="h2h" class="on" onclick="setAlgo('h2h')">Algo 1 · H2H</button><button data-a="form" onclick="setAlgo('form')">Algo 2 · Forme</button></div>
<div id="out"></div>
<p class="mu">Estimations indicatives, aucune garantie de résultat.</p>
<script>
const $=s=>document.querySelector(s),pc=n=>n==null?'N/D':(n*100).toFixed(1).replace('.',',')+' %',f=n=>n==null?'N/D':n.toFixed(2).replace('.',',');
const col=h=>h>=.6?'var(--ac)':h>=.4?'var(--yl)':'var(--rd)';
const MK={points:'⭐ Points',goals:'🥅 Buts',assists:'🎯 Passes',shots:'🏒 Tirs cadrés'};
let G=[],algo='h2h',D=null;
$('#mk').innerHTML=Object.entries(MK).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#dt').value=new Date().toLocaleDateString('sv');
async function games(){
  G=await(await fetch('/api/games?date='+$('#dt').value)).json();
  $('#gm').innerHTML=G.map((g,i)=>`<option value="${i}">${g.away.name} @ ${g.home.name}</option>`).join('')||'<option>Aucun match</option>';
  run();
}
function setAlgo(a){algo=a;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.a===a));run()}
async function run(){
  const g=G[$('#gm').value];if(!g)return;
  $('#out').innerHTML='<p class="mu">Analyse en cours (30 à 60 s la première fois)…</p>';
  try{
    D=await(await fetch(`/api/h2h?away=${g.away.abbrev}&home=${g.home.abbrev}&market=${$('#mk').value}&algo=${algo}`)).json();
    if(D.error)throw 0;draw(g);
  }catch(e){$('#out').textContent='Erreur de chargement, réessaie.'}
}
function draw(g){
  const sc=D.scores.map(s=>`<div>${s.date} · ${s.home} ${s.hs}-${s.as} ${s.away}</div>`).join('')||'<div class="mu">Aucune confrontation trouvée.</div>';
  const rows=D.top.map((x,i)=>{
    const m=algo==='h2h'?x.h:x.r10;
    return `<div class="r" onclick="det(${i})"><img class="h" src="${x.img}" alt=""><div class="in"><b>${x.name}</b><div class="mu">${x.team} | ${m.n} matchs ${algo==='h2h'?'H2H':'récents'} | moy. ${f(m.avg)}</div><div class="bar"><u style="width:${m.hit*100}%;background:${col(m.hit)}"></u></div></div><b>${Math.round(m.hit*100)}%</b></div><div class="det" id="d${i}"></div>`;
  }).join('')||'<p class="mu">Aucun joueur avec des données suffisantes.</p>';
  $('#out').innerHTML=`<div class="card"><b>Dernières confrontations</b>${sc}</div><div class="card"><b>TOP 5 · ${MK[$('#mk').value]}</b>${rows}</div>`;
}
const key=i=>`odd:${$('#dt').value}:${D.top[i].name}:${$('#mk').value}`;
function det(i){
  const x=D.top[i],e=$('#d'+i);
  if(e.innerHTML){e.innerHTML='';return}
  let o='';try{o=localStorage.getItem(key(i))||''}catch(_){}
  const t=(l,s)=>`<div>${l} : ${s?`<b>${s.s}/${s.n}</b> (${Math.round(s.hit*100)} %) · moy. ${f(s.avg)}`:'N/D'}</div>`;
  e.innerHTML=t('H2H',x.h)+t('Forme 5',x.r5)+t('Forme 10',x.r10)+t('Forme 20',x.r20)
   +(x.prob!=null?`<p>Probabilité estimée : <b class="ac">${pc(x.prob)}</b> · Confiance ${x.conf}/100<br><span class="mu">La confiance mesure la qualité des données, pas la chance de gagner.</span></p><input id="o${i}" type="number" step="0.01" placeholder="Ta cote (ex. 2.05)" value="${o}" oninput="val(${i})"><div id="v${i}"></div>`:'')
   +'<h4>Historique H2H</h4>'+(x.hist.map(h=>`<div>${h.d} [${h.home?'DOM':'EXT'}] — ${h.v} ${h.v>=1?'✅':'❌'}</div>`).join('')||'<div class="mu">Aucun match H2H.</div>');
  val(i);
}
function val(i){
  const x=D.top[i],el=$('#o'+i);if(!el)return;
  try{localStorage.setItem(key(i),el.value)}catch(_){}
  const o=parseFloat(el.value),v=$('#v'+i);
  if(!(o>1)){v.innerHTML='';return}
  const imp=1/o,ed=x.prob-imp;
  v.innerHTML=`Probabilité implicite : ${pc(imp)}<br>Écart : ${(ed*100).toFixed(1)} pts · ROI théorique : ${((x.prob*o-1)*100).toFixed(1)} %<br><b style="color:${ed>=.03?'var(--ac)':ed>0?'var(--yl)':'var(--rd)'}">${ed>=.03?'🟢 VALUE POTENTIELLE':ed>0?'🟡 VALUE FAIBLE':'🔴 PAS DE VALUE'}</b>`;
}
games();
</script></body></html>
